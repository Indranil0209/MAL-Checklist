<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAAA // Renewable Specialist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071a2c;
      --blue: #176b9d;
      --sky: #53c7e8;
      --sun: #ffc857;
      --sun-dark: #ef9f28;
      --green: #48c78e;
      --white: #f7fbfc;
      --muted: #8ca7b7;
      --border: rgba(160, 215, 230, .2);
      --danger: #ff7b7b;
      --sans: "DM Sans", sans-serif;
      --heading: Manrope, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--white);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 15% 20%, rgba(83,199,232,.13), transparent 27%),
        radial-gradient(circle at 85% 85%, rgba(255,200,87,.12), transparent 28%),
        var(--navy);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 55px 55px;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(94%, 1060px);
      min-height: 620px;
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(8,28,45,.94);
      box-shadow:
        0 30px 90px rgba(0,0,0,.42),
        0 0 70px rgba(83,199,232,.09);
      animation: enter .7s ease both;
    }

    .app::before,
    .app::after {
      content: "";
      position: absolute;
      z-index: 5;
      width: 70px;
      height: 15px;
      pointer-events: none;
    }

    .app::before {
      top: 18px;
      left: 18px;
      border-top: 2px solid var(--sun);
      border-left: 2px solid var(--sun);
    }

    .app::after {
      right: 18px;
      bottom: 18px;
      border-right: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
    }

    .visual {
      position: relative;
      overflow: hidden;
      padding: 34px;
      border-right: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(13,58,77,.72), rgba(5,24,40,.94)),
        radial-gradient(circle at 50% 30%, rgba(255,200,87,.25), transparent 20rem);
    }

    .visual-header,
    .brand-line {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-line {
      justify-content: flex-start;
      gap: 11px;
      margin-bottom: 48px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: var(--navy);
      border-radius: 12px;
      background: var(--sun);
      box-shadow: 0 0 25px rgba(255,200,87,.35);
      font-size: 19px;
      font-weight: 800;
      animation: logoPulse 3s ease-in-out infinite;
    }

    .brand-name {
      font: 800 13px var(--heading);
      letter-spacing: .08em;
    }

    .brand-name span {
      display: block;
      margin-top: 2px;
      color: var(--sky);
      font-size: 9px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .live {
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .live i {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 1.5s infinite;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .stars::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
        radial-gradient(1px 1px at 22% 12%, rgba(255,255,255,.75), transparent),
        radial-gradient(1.5px 1.5px at 38% 8%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 48% 24%, rgba(255,255,255,.6), transparent),
        radial-gradient(2px 2px at 58% 15%, rgba(255,255,255,.85), transparent),
        radial-gradient(1px 1px at 72% 22%, rgba(255,255,255,.65), transparent),
        radial-gradient(1.5px 1.5px at 82% 10%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 92% 28%, rgba(255,255,255,.55), transparent),
        radial-gradient(1.5px 1.5px at 18% 55%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 32% 62%, rgba(255,255,255,.5), transparent),
        radial-gradient(2px 2px at 44% 48%, rgba(255,255,255,.75), transparent),
        radial-gradient(1px 1px at 68% 58%, rgba(255,255,255,.6), transparent),
        radial-gradient(1.5px 1.5px at 78% 52%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 88% 65%, rgba(255,255,255,.55), transparent),
        radial-gradient(1.5px 1.5px at 5% 85%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 15% 92%, rgba(255,255,255,.5), transparent),
        radial-gradient(2px 2px at 28% 82%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 42% 95%, rgba(255,255,255,.6), transparent),
        radial-gradient(1.5px 1.5px at 60% 88%, rgba(255,255,255,.75), transparent),
        radial-gradient(1px 1px at 75% 96%, rgba(255,255,255,.55), transparent);
      opacity: .9;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    .sunrise {
      position: relative;
      height: 405px;
      display: grid;
      place-items: center;
    }

    .solar-system {
      position: relative;
      width: 340px;
      height: 340px;
      display: grid;
      place-items: center;
    }

    .corona {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,87,.18), transparent 70%);
      filter: blur(10px);
      animation: coronaPulse 5s ease-in-out infinite;
    }

    .sun-rays {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        rgba(255, 200, 87, .08) 0deg 12deg,
        transparent 12deg 24deg
      );
      animation: sunRaysSpin 40s linear infinite;
    }

    .sun {
      position: relative;
      z-index: 2;
      width: 142px;
      height: 142px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 32%, #fff5b1, var(--sun) 45%, var(--sun-dark)),
        radial-gradient(circle at 65% 70%, rgba(239,159,40,.5), transparent 60%);
      box-shadow:
        0 0 30px rgba(255,200,87,.75),
        0 0 100px rgba(255,166,36,.28);
      animation: sunFloat 5s ease-in-out infinite, sunGlow 3s ease-in-out infinite;
    }

    .sun::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle at 65% 60%, rgba(255,243,191,.4), transparent 50%);
      filter: blur(4px);
      animation: surfaceShift 8s linear infinite;
    }

    .sun::after {
      content: "";
      position: absolute;
      inset: -28px;
      border: 1px solid rgba(255,200,87,.3);
      border-radius: 50%;
      box-shadow:
        0 0 0 14px rgba(255,200,87,.06),
        0 0 0 29px rgba(255,200,87,.04);
      animation: sunRings 4s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px dashed rgba(83,199,232,.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: orbitSpin linear infinite;
    }

    .orbit-1 {
      width: 260px;
      height: 260px;
      animation-duration: 18s;
    }

    .orbit-2 {
      width: 320px;
      height: 200px;
      animation-duration: 26s;
      animation-direction: reverse;
    }

    .satellite {
      position: absolute;
      top: 0;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--sky);
      box-shadow: 0 0 14px var(--sky), 0 0 8px var(--white);
      transform: translate(-50%, -50%);
    }

    .orbit-2 .satellite {
      width: 7px;
      height: 7px;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .forecast-label {
      position: absolute;
      bottom: 0;
      left: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .forecast-label strong {
      display: inline-block;
      margin-top: 8px;
      color: var(--sun);
      font-size: 10px;
      letter-spacing: .1em;
      text-shadow: 0 0 16px rgba(255,200,87,.5);
      animation: labelGlow 2.5s ease-in-out infinite alternate;
    }

    .metrics {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
    }

    .metric {
      width: 190px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(4,20,34,.55);
      text-align: center;
      transition: transform .3s ease, box-shadow .3s ease;
      animation: metricFloat 6s ease-in-out infinite;
    }

    .metric:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 14px 35px rgba(0,0,0,.35), 0 0 25px rgba(83,199,232,.1);
      border-color: rgba(83,199,232,.35);
    }

    .metric small {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .metric strong {
      color: var(--white);
      font: 700 18px var(--heading);
    }

    .metric strong span {
      color: var(--green);
      font-size: 10px;
    }

    .login {
      display: flex;
      align-items: center;
      padding: 52px clamp(30px, 5vw, 62px);
      background: rgba(5,19,32,.92);
      position: relative;
    }

    .login::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at -10% 20%, rgba(83,199,232,.07), transparent 30%),
        radial-gradient(circle at 110% 70%, rgba(255,200,87,.06), transparent 30%);
      pointer-events: none;
    }

    .login-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 350px;
      animation: slideIn .7s .15s both;
    }

    .eyebrow {
      margin-bottom: 17px;
      color: var(--sky);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      animation: fadeInUp .6s .35s both;
    }

    h1 {
      margin-bottom: 12px;
      color: var(--white);
      font: 800 30px var(--heading);
      letter-spacing: -.05em;
      animation: fadeInUp .6s .42s both;
    }

    h1 span {
      color: var(--sun);
    }

    .subtitle {
      margin-bottom: 32px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      animation: fadeInUp .6s .5s both;
    }

    .field {
      margin-bottom: 18px;
      animation: fadeInUp .6s both;
    }

    .field:nth-of-type(1) { animation-delay: .55s; }
    .field:nth-of-type(2) { animation-delay: .62s; }

    label {
      display: block;
      margin-bottom: 8px;
      color: #a8c9d7;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      outline: none;
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #061522;
      font: 13px var(--sans);
      transition: .25s ease, box-shadow .25s ease;
    }

    input:focus {
      border-color: var(--sky);
      box-shadow:
        0 0 0 4px rgba(83,199,232,.1),
        0 0 20px rgba(83,199,232,.15);
    }

    input::placeholder {
      color: #526f7d;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      color: #172331;
      background: linear-gradient(100deg, var(--sun), #ffe69a);
      box-shadow: 0 8px 22px rgba(255,200,87,.2);
      font: 700 11px var(--heading);
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .25s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
      );
      transform: skewX(-25deg);
      transition: none;
    }

    button:hover:not(:disabled) {
      box-shadow: 0 10px 30px rgba(255,200,87,.38);
      transform: translateY(-2px);
    }

    button:hover:not(:disabled)::after {
      animation: shimmer .7s ease-in-out;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .58;
    }

    .btn-primary {
      animation: fadeInUp .6s .7s both;
    }

    .forgot {
      margin-top: 19px;
      text-align: center;
      animation: fadeInUp .6s .78s both;
    }

    .forgot a {
      color: var(--sky);
      font-size: 11px;
      text-decoration: none;
      transition: color .2s ease;
    }

    .forgot a:hover {
      color: var(--sun);
    }

    #forgotPinPanel {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      animation: unfold .4s ease both;
    }

    #forgotPinPanel p {
      margin-bottom: 15px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    #forgotSubmitBtn {
      min-height: 46px;
      color: var(--white);
      background: var(--blue);
      box-shadow: none;
    }

    .secure {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
      color: #668495;
      font-size: 9px;
      letter-spacing: .11em;
      text-transform: uppercase;
      animation: fadeIn .8s 1s both;
    }

    .secure span {
      color: var(--green);
    }

    .error-msg,
    #forgotStatusMsg {
      display: none;
      margin-bottom: 16px;
      padding: 11px 13px;
      border: 1px solid var(--danger);
      border-radius: 9px;
      color: var(--danger);
      background: rgba(255,123,123,.08);
      font-size: 11px;
      text-align: center;
      animation: shake .4s ease both;
    }

    .error-msg.show,
    #forgotStatusMsg.error,
    #forgotStatusMsg.success {
      display: block;
    }

    #forgotStatusMsg.success {
      color: var(--green);
      border-color: var(--green);
      background: rgba(72,199,142,.08);
      animation: none;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(22px) scale(.98); }
      to { opacity: 1; transform: none; }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(22px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes unfold {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes sunFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes sunGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(255,200,87,.75), 0 0 100px rgba(255,166,36,.28);
      }
      50% {
        box-shadow: 0 0 45px rgba(255,200,87,.9), 0 0 130px rgba(255,166,36,.45);
      }
    }

    @keyframes sunRings {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: .6; }
    }

    @keyframes sunRaysSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes coronaPulse {
      0%, 100% {
        opacity: .8;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
      }
    }

    @keyframes surfaceShift {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes orbitSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes twinkle {
      from { opacity: .6; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes waveMove {
      from { transform: translateX(0); }
      to { transform: translateX(25%); }
    }

    @keyframes labelGlow {
      from { text-shadow: 0 0 12px rgba(255,200,87,.3); }
      to { text-shadow: 0 0 24px rgba(255,200,87,.65); }
    }

    @keyframes metricFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 25px rgba(255,200,87,.35); }
      50% { box-shadow: 0 0 40px rgba(255,200,87,.55); }
    }

    @keyframes pulse {
      50% { opacity: .35; }
    }

    @keyframes shimmer {
      from { left: -100%; }
      to { left: 200%; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
        padding: 22px 0;
      }

      .app {
        width: min(94%, 450px);
        display: block;
      }

      .visual {
        min-height: 560px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .sunrise {
        height: 415px;
      }

      .solar-system {
        width: 280px;
        height: 280px;
      }

      .sun-rays {
        width: 320px;
        height: 320px;
      }

      .corona {
        width: 260px;
        height: 260px;
      }

      .orbit-1 {
        width: 230px;
        height: 230px;
      }

      .orbit-2 {
        width: 280px;
        height: 180px;
      }

      .login {
        padding: 40px 25px 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="visual">
      <div class="stars" aria-hidden="true"></div>

      <div class="visual-header">
        <div class="brand-line">
          <div class="logo">☀</div>

          <div class="brand-name">
            RAAA
            <span>Renewable Specialist</span>
          </div>
        </div>

        <div class="live"><i></i>LIVE</div>
      </div>

      <div class="sunrise">
        <div class="solar-system">
          <div class="corona" aria-hidden="true"></div>
          <div class="sun-rays" aria-hidden="true"></div>
          <div class="sun"></div>

          <div class="orbit orbit-1" aria-hidden="true">
            <div class="satellite"></div>
          </div>

          <div class="orbit orbit-2" aria-hidden="true">
            <div class="satellite"></div>
          </div>
        </div>

        <div class="forecast-label">
          <div>TODAY'S OUTLOOK</div>
          <strong>HIGH SOLAR AVAILABILITY</strong>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <small>Peak Output</small>
          <strong>103<span> GW</span></strong>
        </div>
      </div>
    </section>

    <section class="login">
      <div class="login-content">
        <div class="eyebrow">RAAA Portal</div>

        <h1>Welcome <span>Forecast Doctor</span></h1>

        <p class="subtitle"></p>

        <div class="error-msg" id="errorMsg" role="alert"></div>

        <div class="field">
          <label for="idInput">Employee ID</label>
          <input
            id="idInput"
            type="text"
            placeholder="Enter employee ID"
            autocomplete="username"
          >
        </div>

        <div class="field">
          <label for="pinInput">Access PIN</label>
          <input
            id="pinInput"
            type="password"
            placeholder="Enter 4 digit PIN"
            autocomplete="current-password"
          >
        </div>

        <button id="loginBtn" class="btn-primary" type="button">LOG IN</button>

        <div class="forgot">
          <a href="#" id="forgotPinLink">Forgot your PIN?</a>
        </div>

        <div id="forgotPinPanel">
          <p>
            Enter your employee ID to send a PIN reset request to your administrator.
          </p>

          <div class="field">
            <label for="forgotIdInput">Employee ID</label>
            <input id="forgotIdInput" type="text" placeholder="Enter employee ID">
          </div>

          <button id="forgotSubmitBtn" type="button">
            Send reset request
          </button>

          <div id="forgotStatusMsg" role="status"></div>
        </div>

        <div class="secure">
          <span></span>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAHzVTjMA0ErfhEhP7a1kQJBCNEV9yMxRo",
      authDomain: "pss-checklist.firebaseapp.com",
      projectId: "pss-checklist",
      storageBucket: "pss-checklist.firebasestorage.app",
      messagingSenderId: "66873555979",
      appId: "1:66873555979:web:ddd15dacbb8f003e529b0e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ADMIN_ID = "admin";
    const ADMIN_PIN = "1111";
    const ROLE_KEY = "intimation-tracker-role";
    const ID_KEY = "intimation-tracker-userid";
    const NAME_KEY = "intimation-tracker-loginname";
    const PIN_REGEX = /^\d{4}$/;

    const idInput = document.getElementById("idInput");
    const pinInput = document.getElementById("pinInput");
    const loginBtn = document.getElementById("loginBtn");
    const errorMsg = document.getElementById("errorMsg");

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add("show");
      setTimeout(() => errorMsg.classList.remove("show"), 5000);
    }

    function setForgotStatus(type, message) {
      forgotStatus.classList.remove("error", "success");
      if (!type) {
        forgotStatus.textContent = "";
        return;
      }
      forgotStatus.classList.add(type);
      forgotStatus.textContent = message;
    }

    async function login() {
      errorMsg.classList.remove("show");

      const id = idInput.value.trim().toLowerCase();
      const pin = pinInput.value.trim();

      if (!id || !pin) {
        showError("Please enter both your employee ID and access PIN.");
        return;
      }

      if (!PIN_REGEX.test(pin)) {
        showError("PIN must be exactly 4 digits.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying access...";

      if (id === ADMIN_ID) {
        if (pin === ADMIN_PIN) {
          sessionStorage.setItem(ROLE_KEY, "admin");
          sessionStorage.setItem(ID_KEY, ADMIN_ID);
          sessionStorage.setItem(NAME_KEY, "Admin");
          loginBtn.textContent = "Access granted";
          setTimeout(() => { window.location.href = "admin_dashboard.html"; }, 700);
        } else {
          showError("Invalid employee ID or PIN.");
          pinInput.value = "";
          loginBtn.disabled = false;
          loginBtn.textContent = "LOG IN";
        }
        return;
      }

      try {
        const employeeDoc = await db.collection("employees").doc(id).get();
        const employee = employeeDoc.data();

        if (!employeeDoc.exists || employee.pin !== pin || employee.active === false) {
          showError("Invalid employee ID or PIN.");
          pinInput.value = "";
          loginBtn.disabled = false;
          loginBtn.textContent = "LOG IN";
          return;
        }

        sessionStorage.setItem(ROLE_KEY, "employee");
        sessionStorage.setItem(ID_KEY, id);
        sessionStorage.setItem(NAME_KEY, employee.name || id);

        loginBtn.textContent = "Access granted";
        setTimeout(() => { window.location.href = "employee_dashboard.html"; }, 700);
      } catch (error) {
        console.error(error);
        showError("Unable to connect to the generation portal.");
        loginBtn.disabled = false;
        loginBtn.textContent = "LOG IN";
      }
    }

    loginBtn.addEventListener("click", login);

    idInput.addEventListener("keydown", event => {
      if (event.key === "Enter") pinInput.focus();
    });

    pinInput.addEventListener("keydown", event => {
      if (event.key === "Enter") login();
    });

    const forgotLink = document.getElementById("forgotPinLink");
    const forgotPanel = document.getElementById("forgotPinPanel");
    const forgotIdInput = document.getElementById("forgotIdInput");
    const forgotButton = document.getElementById("forgotSubmitBtn");
    const forgotStatus = document.getElementById("forgotStatusMsg");

    forgotLink.addEventListener("click", event => {
      event.preventDefault();
      const isOpening = forgotPanel.style.display !== "block";
      forgotPanel.style.display = isOpening ? "block" : "none";
      setForgotStatus(null, "");
      if (isOpening) forgotIdInput.focus();
    });

    forgotButton.addEventListener("click", async () => {
      const id = forgotIdInput.value.trim().toLowerCase();

      if (!id) {
        setForgotStatus("error", "Please enter your employee ID.");
        return;
      }

      forgotButton.disabled = true;
      forgotButton.textContent = "Sending...";

      try {
        const employeeDoc = await db.collection("employees").doc(id).get();
        if (!employeeDoc.exists) throw new Error("Employee not found");

        const employee = employeeDoc.data();

        await db.collection("pinResetRequests").add({
          employeeId: id,
          employeeName: employee.name || id,
          requestedAt: new Date().toISOString(),
          resolved: false
        });

        setForgotStatus("success", "Reset request sent successfully.");
        forgotIdInput.value = "";
      } catch (error) {
        console.error(error);
        setForgotStatus("error", "Unable to send request. Please try again.");
      } finally {
        forgotButton.disabled = false;
        forgotButton.textContent = "Send reset request";
      }
    });
  </script>
</body>
</html>
